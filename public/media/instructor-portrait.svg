<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated portrait of Meera Kaur</title>
  <desc id="desc">A stylised magenta and gold portrait placeholder of a Hindustani vocalist, eyes closed, with a tanpura drone behind her.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#7c2752"/>
      <stop offset="46%" stop-color="#3a0e27"/>
      <stop offset="100%" stop-color="#10030b"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d0d20"/>
      <stop offset="52%" stop-color="#250713"/>
      <stop offset="100%" stop-color="#15030b"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b030d"/>
      <stop offset="100%" stop-color="#080104"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0a3"/>
      <stop offset="48%" stop-color="#e9b44c"/>
      <stop offset="100%" stop-color="#b77634"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c1735"/>
      <stop offset="60%" stop-color="#2a0716"/>
      <stop offset="100%" stop-color="#15030c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity=".5" fill="none" stroke="url(#gold)">
    <circle cx="410" cy="392" r="304" stroke-width="1" opacity=".3"/>
    <circle cx="410" cy="392" r="254" stroke-width=".7" opacity=".18"/>
    <circle cx="410" cy="392" r="214" stroke-width=".5" opacity=".12"/>
  </g>

