<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A Sunday class</title>
  <desc id="desc">A cinematic illustrated still of a warmly lit music room with a harmonium and two musicians.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180b10"/>
      <stop offset="55%" stop-color="#3a1420"/>
      <stop offset="100%" stop-color="#0d0508"/>
    </linearGradient>
    <radialGradient id="window" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffdf9d"/>
      <stop offset="42%" stop-color="#e9a75a"/>
      <stop offset="100%" stop-color="#8c3a2a" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffd99a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffd99a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a140e"/>
      <stop offset="45%" stop-color="#6c3c22"/>
      <stop offset="100%" stop-color="#25100c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#room)"/>

  <g opacity=".55">
    <path d="M770 40h310v430H770z" fill="url(#window)"/>
