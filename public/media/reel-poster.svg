    <path d="M920 40v430M770 255h310" stroke="#1a0a0d" stroke-width="10"/>
    <path d="M770 40h310v430H770z" fill="#1a0a0d" opacity=".18"/>
  </g>

  <path d="M745 60 430 675h740L940 60Z" fill="url(#beam)" filter="url(#blur)"/>

